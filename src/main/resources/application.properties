spring.application.name=mail-service

# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Configuration
server.port=${PORT:8080}

# User service integration (set USER_SERVICE_BASE_URL and USER_SERVICE_API_KEY in each environment)
user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
user-service.api-key=${USER_SERVICE_API_KEY:}

# Logging Configuration
logging.level.com.satish.mailservice=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# Email List Headers Configuration
email.list.headers=SNo,Name,Email,Job title,Company name,First name,Last name

# Mail Configuration (SMTP for sending emails)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Scheduler Configuration
scheduler.cold-email.enabled=true
scheduler.cold-email.cron=0 0 20 * * ?
scheduler.cold-email.batch-size=20
scheduler.cold-email.interval-minutes=1

# Resume Storage Path
resume.storage.path=${RESUME_STORAGE_PATH:${user.home}/mail-service/resumes}

#cors
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,https://mail-desk-three.vercel.app}
